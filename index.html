<meta charset="UTF-8">

<title>Case Nature Finder</title>
<style>
:root{
  --bg:#EEF1F4; --panel:#FFFFFF; --ink:#16202A; --muted:#5C6B7A; --line:#D5DBE2;
  --accent:#0B5C6B; --mark:#FFE27A; --markink:#3A2D00; --focus:#0B5C6B;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#10161C; --panel:#18212A; --ink:#E7EDF2; --muted:#93A3B3; --line:#2B3846;
         --accent:#58C1D2; --mark:#6B5A12; --markink:#FFF3C2; --focus:#58C1D2; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 18px 12px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:10px}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em}
.count{color:var(--muted);font-size:14px}
.count b{color:var(--ink);font-size:17px}
.spacer{flex:1}
button.clear{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:6px;font:inherit;cursor:pointer}
button.clear:hover{border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:480px){.grid{grid-template-columns:1fr}}
label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:3px}
input{width:100%;padding:10px 11px;font:inherit;font-size:16px;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:6px}
input::placeholder{color:var(--muted);opacity:.7}
input:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent)}
input.active{border-color:var(--accent)}
.hint{margin:8px 0 0;font-size:12.5px;color:var(--muted)}
.chips{margin-top:6px;display:flex;flex-wrap:wrap;gap:5px;font-size:12px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:1px 9px;color:var(--muted)}
main{padding:14px 18px 40px}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:6px;padding:10px 12px 10px 12px;display:flex;gap:12px;align-items:center;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.card:hover{border-color:var(--c)}
.card:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.id{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--c);min-width:58px;letter-spacing:-.02em}
.name{font-size:16px;font-weight:600;line-height:1.25}
.cat{font-size:12.5px;color:var(--muted);margin-top:2px}
.cat span{display:inline-block;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--ink);padding:0 7px;border-radius:4px;font-weight:600}
mark{background:var(--mark);color:var(--markink);border-radius:2px;padding:0 1px}
.copied{position:absolute;right:8px;top:6px;font-size:11.5px;color:var(--accent);font-weight:700}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.badge{position:absolute;right:8px;bottom:6px;font-size:11px;color:var(--muted)}
</style>
</head>

const PALETTE = ['#1F6FB0','#C0392B','#2E8B4A','#8E5BC0','#D9730D','#0B8FA3','#8C5A2B','#4A5CC0','#C03C85','#6B9A00'];
const catOrder = []; DATA.forEach(d=>{ if(!catOrder.includes(d[0])) catOrder.push(d[0]); });
const catColor = c => PALETTE[catOrder.indexOf(c) % PALETTE.length];

const norm = s => s.toLowerCase().replace(/[^a-z0-9]/g,'');
const tokenize = s => (s.toLowerCase().match(/[a-z0-9]+/g) || []);
const stem = w => w.length>4 ? w.replace(/(ing|ed|es|s)$/,'') : w.replace(/s$/,'');

/* Damerau-Levenshtein (counts a swapped pair of letters as one mistake) */
function dist(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  const d=[]; for(let i=0;i<=m;i++){d[i]=[i]; } for(let j=0;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++){
    const c=a[i-1]===b[j-1]?0:1;
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);
  }
  return d[m][n];
}
const allowed = len => len<=3 ? 0 : len<=6 ? 1 : 2;

/* Does query word q match token t? returns true/false */
function wordMatch(q,t,fuzzy){
  if(q===t) return true;
  const sq=stem(q), st=stem(t);
  if(sq===st) return true;
  if(!fuzzy) return false;                                   // synonym words must match a whole word
  if(t.startsWith(q)) return true;                           // typed letters match the start of any word, from 1 letter
  if(fuzzy && q.length>=3 && t.includes(q)) return true;     // "cycle" -> motorcycle
  if(sq.length>=4 && st.startsWith(sq)) return true;
  if(st.length>=4 && sq.startsWith(st) && sq.length-st.length<=3) return true;
  if(!fuzzy || q[0]!==t[0]) return false;                 // typo tolerance only for what you typed
  const lim = allowed(Math.min(q.length,t.length));
  return lim>0 && dist(q,t)<=lim;
}

/* Build lookup: word -> group index */
const groupOf = new Map();
SYN.forEach((g,i)=>g.forEach(w=>{ const k=norm(w); if(!groupOf.has(k)) groupOf.set(k,[]); groupOf.get(k).push(i); }));
const synWords = [...groupOf.keys()];

/* Expand typed word into {word, weight} list: typed word (3), similar words (2) */
function expand(q){
  const out = new Map(); out.set(q,3);
  let groups = new Set(groupOf.get(q)||[]);
  if(!groups.size && q.length>=4){                      // typo in a known synonym word
    for(const w of synWords){ if(Math.abs(w.length-q.length)<=2 && dist(q,w)<=allowed(Math.min(q.length,w.length))) (groupOf.get(w)).forEach(g=>groups.add(g)); }
  }
  groups.forEach(g=>SYN[g].forEach(w=>{ const k=norm(w); if(!out.has(k)) out.set(k,2); }));
  return out;
}

const items = DATA.map(([cat,id,name])=>({cat,id,name,toks:[...new Set([...tokenize(name),...tokenize(cat)])]}));
const inputs = [1,2,3,4].map(i=>document.getElementById('o'+i));
const res = document.getElementById('res');

function parse(v){ return v.split(/[\s,;+]+/).map(norm).filter(Boolean); }

function run(){
  const groups = inputs.map(i=>parse(i.value)).map(ws=>ws.map(expand)).filter(g=>g.length);
  inputs.forEach(i=>i.classList.toggle('active', parse(i.value).length>0));
  let list = items.map(it=>({it,score:0,hit:new Set()}));
  if(groups.length){
    list = list.filter(r=>{
      for(const opt of groups){
        let best=0;
        for(const terms of opt){                         // each typed word of this option (OR)
          for(const [w,wt] of terms){
            for(const t of r.it.toks){
              if(wordMatch(w,t,wt===3)){ best=Math.max(best,wt); r.hit.add(t); }
            }
          }
        }
        if(!best) return false;                          // this option fails -> hidden (AND between options)
        r.score+=best;
      }
      return true;
    });
    list.sort((a,b)=>b.score-a.score || a.it.id-b.it.id);
  }
  render(list, groups.length>0);
}

const esc = s => s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hl(text,hit){
  return text.split(/([A-Za-z0-9]+)/).map(p=>{
    const k=p.toLowerCase();
    return hit.has(k) ? '<mark>'+esc(p)+'</mark>' : esc(p);
  }).join('');
}

function render(list,filtered){
  document.getElementById('n').textContent=list.length;
  if(!list.length){
    res.innerHTML='<div class="empty" style="grid-column:1/-1"><b>No case nature matches</b>Remove a word from one of the options, or try a simpler word.</div>';
    return;
  }
  res.innerHTML=list.map(r=>`<button type="button" class="card" style="--c:${catColor(r.it.cat)}" data-copy="${esc(r.it.name)}">
    <div><div class="name">${hl(r.it.name,r.hit)}</div><div class="cat"><span>${hl(r.it.cat,r.hit)}</span></div></div>
  </button>`).join('');
}

res.addEventListener('click',e=>{
  const c=e.target.closest('.card'); if(!c) return;
  const txt=c.dataset.copy.replace(/&amp;/g,'&');
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).catch(()=>{
    const t=document.createElement('textarea'); t.value=txt; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove();
  });
  const s=document.createElement('span'); s.className='copied'; s.textContent='Copied'; c.appendChild(s); setTimeout(()=>s.remove(),900);
});

inputs.forEach(i=>i.addEventListener('input',run));
function clearAll(){ inputs.forEach(i=>i.value=''); run(); inputs[0].focus(); }
document.getElementById('clear').addEventListener('click',clearAll);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') clearAll(); });
